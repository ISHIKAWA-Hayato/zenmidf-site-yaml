<!doctype html>
<html lang="ja">
    <head>
        <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-M4EWZ424QB"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "G-M4EWZ424QB");
        </script>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>メンバーコミュニティ | 全国マルス情報データファイル</title>
        <link href="/images/fav.png" rel="icon" type="image/png" />
        <link href="css/style.css" rel="stylesheet" />
    </head>
    <body>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <nav class="sidenav" id="sidenav">
            <h2>メニュー</h2>
            <!-- メニュー -->
        </nav>
        <div class="overlay" id="overlay"></div>
        <header>
            <h1><a href="https://www.zenmidf.jp"> 全国マルス情報データファイル </a></h1>
        </header>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li><a href="https://www.zenmidf.jp"> ホーム </a></li>
                <li><a href="member-service.html">会員サービス ログイン</a></li>
                <li aria-current="page">メンバーコミュニティ</li>
            </ol>
        </nav>

        <main>
            <div class="container">
                <h2>会員一覧</h2>
                <div id="member-list-container">
                    <p id="loading-message">読み込み中...</p>
                </div>
            </div>
        </main>

        <footer>
            <p><a class="footer-link" href="https://www.zenmidf.jp"> サイトホームに戻る </a></p>
            <p class="copyright">
                © <span class="current-year"></span> 全国マルス情報データファイル. All Rights Reserved.
            </p>
        </footer>

        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

        <script>
            // Firebaseの初期化設定
            const firebaseConfig = {
                apiKey: "AIzaSyDj7cgQ1LqTed8jclGpsH6s9bhLKd4QZao",
                authDomain: "zenmidf.firebaseapp.com",
                projectId: "zenmidf",
                storageBucket: "zenmidf.firebasestorage.app",
                messagingSenderId: "813179608121",
                appId: "1:813179608121:web:a155f40ebf98d4372381e8",
                measurementId: "G-FE2CLXMMPZ"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            // バッジの色を生成する関数（member-service.htmlからコピー）
            function stringToHslColor(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = hash % 360;
                return `hsl(${hue}, 70%, 45%)`;
            }

            // ログイン状態を監視
            auth.onAuthStateChanged((user) => {
                const listContainer = document.getElementById("member-list-container");
                const loadingMessage = document.getElementById("loading-message");

                if (user && user.emailVerified) {
                    // ログインしている場合、全ユーザーの情報を取得
                    db.collection("users")
                        .get()
                        .then((querySnapshot) => {
                            loadingMessage.style.display = "none"; // 読み込みメッセージを非表示

                            if (querySnapshot.empty) {
                                listContainer.innerHTML = "<p>登録されている会員がいません。</p>";
                                return;
                            }

                            querySnapshot.forEach((doc) => {
                                const userData = doc.data();

                                // 各ユーザー情報を表示するカードを作成
                                const card = document.createElement("div");
                                card.className = "member-card";

                                let badgesHTML = "";
                                if (userData.badges && userData.badges.length > 0) {
                                    userData.badges.forEach((badgeName) => {
                                        const color = stringToHslColor(badgeName);
                                        badgesHTML += `<span class="user-badge" style="background-color:${color};">${badgeName}</span>`;
                                    });
                                }

                                // カードの中身
                                card.innerHTML = `
                                <h3>${userData.nickname || "（未設定）"}</h3>
                                <p><strong>自己紹介:</strong></p>
                                <p>${userData.bio || "（未設定）"}</p>
                                <div>${badgesHTML}</div>
                            `;

                                listContainer.appendChild(card);
                            });
                        })
                        .catch((error) => {
                            console.error("ユーザー一覧の取得エラー:", error);
                            loadingMessage.textContent = "エラーが発生しました。";
                        });
                } else {
                    // ログアウトしている場合
                    loadingMessage.innerHTML =
                        '会員一覧を閲覧するには、<a href="/member-service.html">ログイン</a>が必要です。';
                }
            });
        </script>
        <script src="js/common.js"></script>
    </body>
</html>
