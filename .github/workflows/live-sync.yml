name: 準備中の会社を本番に合わせる（毎日）

# FTP から YAML へ移す準備期間の会社（_index.yaml に「準備中: true」）について、
# 本番サイトの駅別ページを取ってきて駅データを作り直し、変わっていれば PR を出す（同じブランチ live-sync を毎回更新）。
# 準備期間は本番（FTP）が正。この PR をマージしても準備中の会社のページは本番に上がらない（dist/staging に作られるだけ）
on:
  schedule:
    - cron: "41 19 * * *"   # 毎日 4:41（日本時間）
  workflow_dispatch:

concurrency:
  group: live-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Python を準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 道具を準備
        run: pip install pyyaml jinja2 beautifulsoup4 html5lib

      - name: 準備中の会社を調べる
        id: list
        run: |
          companies=$(python -c "import pathlib,yaml; print(' '.join(str(p.parent.relative_to('data')) for p in sorted(pathlib.Path('data').rglob('_index.yaml')) if yaml.safe_load(p.read_text(encoding='utf-8')).get('準備中')))")
          echo "companies=$companies" >> "$GITHUB_OUTPUT"
          echo "準備中の会社: ${companies:-なし}" >> "$GITHUB_STEP_SUMMARY"

      - name: 本番の駅ページを取る
        if: steps.list.outputs.companies != ''
        run: python tools/fetch_live.py /tmp/live ${{ steps.list.outputs.companies }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 駅データを作り直して本番と照合する
        if: steps.list.outputs.companies != ''
        run: |
          python tools/sync_live.py /tmp/live | grep -v '^変換' | tee /tmp/sync.txt
          { echo '```'; cat /tmp/sync.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 変わっていれば PR を出す
        if: steps.list.outputs.companies != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "本番に変化なし" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B live-sync
          git add data
          changed=$(git diff --cached --name-only data | grep -v '_index.yaml$' | sed 's#^data/##; s#\.yaml$##' | head -40 | tr '\n' ' ')
          git commit -qm "本番（FTP）の変更を駅データに反映: $changed"
          git push -f origin live-sync
          body=$(printf '準備期間中の会社について、本番（FTP で直したページ）の変更を駅データに反映しました。\n\n変わった駅: %s\n\n本番との照合結果:\n```\n%s\n```\n\n準備期間は本番（FTP）が正です。差分が本番の変更どおりならマージしてください（このマージで準備中の会社のページが本番に上がることはありません）。' "$changed" "$(cat /tmp/sync.txt)")
          if gh pr list --head live-sync --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit live-sync --body "$body"
          else
            gh pr create --head live-sync --base main --title "本番（FTP）の変更を駅データに反映" --body "$body"
          fi
