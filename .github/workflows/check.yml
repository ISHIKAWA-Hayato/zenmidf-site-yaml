name: PR の確認

# PR ごとに、駅データ・テンプレートからページを作れるか（YAML の書き間違いがないか）を確かめる。
# main の保護（ルールセット）で、この確認（build）が通らない PR はマージできないようにしている
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jinja2 pillow pillow-heif

      # shell: bash を明示すると pipefail が付き、tee の前の build.py が失敗したときにこの確認も失敗になる
      # （明示しないと tee の終了コードだけで判定され、生成に失敗しても「成功」になってしまう）
      - name: ページを生成できるか
        shell: bash
        run: python tools/build.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: inbox の写真を取り込めるか（試すだけ。取り込みはマージ後に Actions がする）
        id: images
        run: python tools/import_images.py

      - name: 取り込めない写真があれば知らせる
        if: steps.images.outputs.errors != '0' && steps.images.outputs.errors != ''
        run: |
          echo "::error::取り込めない写真があります（理由は上の「inbox の写真を取り込めるか」の表示）"
          exit 1
