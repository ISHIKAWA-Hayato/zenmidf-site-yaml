name: 本番の駅ページを取得（01〜03 移行用）

# 本番サイトに出ている駅別ページ（FTP で手書きしている会社）を取ってきて、
# ブランチ live-snapshot に置く。YAML へ移す準備期間に、移行元のデータとして使う。
# main には何も書かない（本番へのアップロードもしない）
on:
  workflow_dispatch:
    inputs:
      companies:
        description: "取る会社フォルダ（空白区切り）"
        default: "01-Hokkaido 02-East-Japan 03-Central-Japan"
        required: true

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Python を準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 本番の駅ページを取る
        run: python tools/fetch_live.py live ${{ inputs.companies }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ブランチ live-snapshot に置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-snapshot
          git rm -rq --cached .
          git add live
          git commit -qm "本番の駅ページ（$(date -u +%Y-%m-%dT%H:%MZ) 取得）: ${{ inputs.companies }}"
          git push -f origin live-snapshot
