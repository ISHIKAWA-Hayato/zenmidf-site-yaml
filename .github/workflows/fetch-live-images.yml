name: 本番の駅写真を取得（01〜03 切替用・一度だけ）

# 01〜03 の駅データの「画像:」が指す写真をサーバーから取って、ブランチ live-snapshot に置く（切替後にこのファイルは消す）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 写真を取る
        run: |
          python - <<'PY'
          import pathlib, time, urllib.parse, urllib.request, yaml
          base = "https://www.zenmidf.jp/station-individual/"
          n = 0
          for c in ["01-Hokkaido", "02-East-Japan", "03-Central-Japan"]:
              for y in sorted(pathlib.Path("data", c).glob("[!_]*.yaml")):
                  img = (yaml.safe_load(y.read_text(encoding="utf-8")) or {}).get("画像")
                  if not img:
                      continue
                  url = urllib.parse.urljoin(base + c + "/" + y.stem + ".html", str(img))
                  rel = url[len(base):]
                  out = pathlib.Path("/tmp/out", rel)
                  if out.exists():
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(urllib.request.urlopen(url, timeout=30).read())
                  n += 1
                  time.sleep(0.2)
          print("取得", n, "枚")
          PY
      - name: ブランチに置く
        run: |
          cd /tmp/out
          git init -q -b live-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "本番の駅写真（01〜03）"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-snapshot
