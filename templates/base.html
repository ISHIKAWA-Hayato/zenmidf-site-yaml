<!doctype html>
<html lang="ja">
<head>
<script async="" src="https://www.googletagmanager.com/gtag/js?id={{ site.GA }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag() {
dataLayer.push(arguments);
}
gtag("js", new Date());
gtag("config", "{{ site.GA }}");
</script>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>{{ title }} | {{ site.サイト名 }}</title>
<meta content="{{ description }}" name="description" />
<link href="{{ site.ファビコン }}" rel="icon" type="image/png" />
<link href="{{ root }}css/style.css" rel="stylesheet" />
</head>
<body>
<button class="hamburger" id="hamburger">
<span> </span>
<span> </span>
<span> </span>
</button>
<nav class="sidenav" id="sidenav">
<h2>メニュー</h2>
<ul>
{% for label, url in site.メニュー %}
<li><a href="{{ url }}">{{ label }}</a></li>
{% endfor %}
</ul>
</nav>
<div class="overlay" id="overlay"></div>
<header>
<h1>
<a href="{{ site.トップ }}"> {{ site.サイト名 }} </a>
</h1>
</header>
<nav aria-label="breadcrumb">
<ol class="breadcrumb">
<li><a href="{{ site.トップ }}"> ホーム </a></li>
<li><a href="{{ site.トップ }}/station-individual.html"> 駅別ページ </a></li>
{% for label, url in crumbs %}
<li><a href="{{ url }}"> {{ label }} </a></li>
{% endfor %}
<li aria-current="page">{{ current }}</li>
</ol>
</nav>
<main>
{% block main %}{% endblock %}
</main>
<footer>
<p>
<a class="footer-link" href="{{ site.トップ }}"> サイトホームに戻る </a>
</p>
<p class="footer-policy">
<a href="{{ site.トップ }}/terms.html">利用規約</a>　｜　<a href="{{ site.トップ }}/privacy.html">プライバシーポリシー</a>
</p>
<p class="copyright">
©
<span class="current-year"> </span>
{{ site.サイト名 }}
</p>
</footer>
<script src="{{ root }}js/common.js"></script>
</body>
</html>
